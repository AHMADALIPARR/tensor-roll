[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tensor-roll"
version = "0.1.0"
description = "Tensor Roll — Recursive CUDA-Q Model Quantizer (experimental)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
dependencies = ["numpy>=1.24"]

[project.scripts]
tensor-roll = "tensor_roll.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tensor_roll*"]
